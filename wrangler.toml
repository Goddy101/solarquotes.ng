# wrangler.toml
name = "solar-quotes-ng"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-24"

# CRITICAL: Required for Supabase and Astro Edge APIs to function properly
compatibility_flags = ["nodejs_compat"]

# --------------------------------------------------------
# PRODUCTION ENVIRONMENT (Live Domain)
# --------------------------------------------------------
[env.production]
[env.production.vars]
PUBLIC_SUPABASE_URL = "https://your-prod-project-id.supabase.co"
ENVIRONMENT = "production"

# --------------------------------------------------------
# PREVIEW ENVIRONMENT (GitHub PRs & Staging)
# --------------------------------------------------------
[env.preview]
[env.preview.vars]
PUBLIC_SUPABASE_URL = "https://your-dev-project-id.supabase.co" # Optional: Use a separate Supabase project for testing
ENVIRONMENT = "preview"